<!doctype html><html lang="en"><meta charset="utf-8"><title>Audio review</title>
<style>
:root{--bg:#1b1a17;--fg:#e8e2d0;--dim:#9a937c;--acc:#d8a84a;--bad:#e0594a}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif;display:flex;flex-direction:column;height:100vh}
header{padding:10px 16px;border-bottom:1px solid #3a372f;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
h1{font-size:16px;margin:0;flex:1 1 auto}
select,button{background:#2b2924;color:var(--fg);border:1px solid #4a463b;border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
button:hover{border-color:var(--acc)} audio{width:100%}
#main{display:flex;flex:1;min-height:0}
#list{flex:1;overflow:auto;padding:8px 16px}
#side{width:340px;border-left:1px solid #3a372f;overflow:auto;padding:8px 12px}
.c{padding:8px 10px;margin:4px 0;border-radius:8px;border:1px solid #2f2c25;cursor:pointer}
.c.cur{border-color:var(--acc);background:#2a261c}
.c .h{font-size:12px;color:var(--dim)} .c .heard{font-size:12px;color:#80a2c8}
.c .heard.bad{color:var(--bad)}
.tick{display:inline-block;background:var(--bad);color:#000;border-radius:4px;padding:0 5px;margin-left:5px;font-size:11px}
.tick.W{background:#d68a3a}.tick.P{background:#c0b84a}.tick.N{background:#8aa}
.m{padding:5px 6px;border-bottom:1px solid #2f2c25;font-size:13px}
.m button{padding:0 6px;font-size:12px}
kbd{background:#2b2924;border:1px solid #4a463b;border-radius:4px;padding:0 5px}
#help{font-size:12px;color:var(--dim);padding:4px 16px}
#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--acc);color:#000;padding:6px 14px;border-radius:8px;opacity:0;transition:opacity .2s}
</style>
<header><h1 id="t"></h1><select id="seg"></select><label>speed <select id="spd"><option>0.8</option><option selected>1</option><option>1.25</option></select></label>
<label>reaction lag <select id="lag"><option>0.2</option><option selected>0.4</option><option>0.6</option><option>0.9</option></select> s</label>
<button id="link">Link marks file</button><button id="dl">Download marks</button></header>
<audio id="au" controls></audio>
<div id="help"><kbd>Space</kbd> play/pause · <kbd>A</kbd> artifact / extra sound · <kbd>W</kbd> wrong or mispronounced word · <kbd>P</kbd> odd pause · <kbd>N</kbd> note · <kbd>R</kbd> replay 3 s · <kbd>J</kbd>/<kbd>K</kbd> prev/next sentence · <kbd>Z</kbd> undo · <kbd>&larr;</kbd>/<kbd>&rarr;</kbd> ±2 s. Press the key when you hear it; the lag setting backs the mark up to the moment it began. Unmarked = fine.</div>
<div id="main"><div id="list"></div><div id="side"><b>Marks</b><div id="marks"></div></div></div><div id="toast"></div>
<script>
const D=/*DATA*/null; const $=s=>document.getElementById(s); const au=$('au'); let si=0, marks=[], fh=null, KEY='rev:'+D.title;
$('t').textContent=D.title; D.segments.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.job+'  ('+s.dur+' s)';$('seg').appendChild(o)});
try{marks=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){}
function toast(m){const t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.opacity=0,1100)}
function load(i){si=i;au.src=D.segments[i].audio;au.playbackRate=+$('spd').value;render()}
function chunkAt(t){const cs=D.segments[si].chunks;let k=0;for(let i=0;i<cs.length;i++){if(t>=cs[i].start-0.15)k=i}return k}
function render(){const s=D.segments[si];const L=$('list');L.innerHTML='';s.chunks.forEach((c,i)=>{const d=document.createElement('div');d.className='c';d.id='c'+i;
 const my=marks.filter(m=>m.job==s.job&&m.chunk==c.i);
 d.innerHTML='<div class="h">#'+c.i+' · take '+c.take+' · '+c.start.toFixed(1)+'–'+c.end.toFixed(1)+' s'+my.map(m=>'<span class="tick '+m.type+'">'+m.type+' '+m.t_in_chunk.toFixed(1)+'</span>').join('')+'</div><div>'+c.text+'</div>'+(c.heard?'<div class="heard'+((c.errs||c.extra)?' bad':'')+'">Whisper: '+c.heard+'</div>':'');
 d.onclick=()=>{au.currentTime=c.start;au.play()};L.appendChild(d)});renderMarks()}
function renderMarks(){const M=$('marks');M.innerHTML='';marks.slice().reverse().forEach((m,ri)=>{const idx=marks.length-1-ri;const d=document.createElement('div');d.className='m';
 d.innerHTML='<b>'+m.type+'</b> '+m.job+' #'+m.chunk+' @'+m.t_in_chunk.toFixed(2)+'s '+(m.note?'— '+m.note:'')+' <button data-p="'+idx+'">play</button> <button data-d="'+idx+'">x</button>';M.appendChild(d)});
 M.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.dataset.p!==undefined){const m=marks[+b.dataset.p];$('seg').value=m.seg;if(si!=m.seg)load(m.seg);au.currentTime=Math.max(0,m.abs_t-1.5);au.play()}else{marks.splice(+b.dataset.d,1);save();render()}})}
async function save(){localStorage.setItem(KEY,JSON.stringify(marks));if(fh){try{const w=await fh.createWritable();await w.write(JSON.stringify({title:D.title,marks},null,1));await w.close()}catch(e){}}}
function mark(type,note){const lag=+$('lag').value;const t=Math.max(0,au.currentTime-lag);const s=D.segments[si];const k=chunkAt(t);const c=s.chunks[k];
 marks.push({type,note:note||'',job:s.job,seg:si,chunk:c.i,take:c.take,t_in_chunk:Math.max(0,t-c.start),abs_t:+t.toFixed(2),text:c.text,heard:c.heard,when:new Date().toISOString()});save();render();toast(type+' marked in #'+c.i)}
$('seg').onchange=e=>load(+e.target.value);$('spd').onchange=()=>au.playbackRate=+$('spd').value;
$('dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({title:D.title,marks},null,1)],{type:'application/json'}));a.download='marks-'+D.title.replace(/\W+/g,'_')+'.json';a.click()};
$('link').onclick=async()=>{if(!window.showSaveFilePicker){toast('Not supported here: use Download');return}try{fh=await showSaveFilePicker({suggestedName:'marks.json',types:[{accept:{'application/json':['.json']}}]});await save();toast('Marks autosave to that file')}catch(e){}};
au.ontimeupdate=()=>{const k=chunkAt(au.currentTime);document.querySelectorAll('.c.cur').forEach(x=>x.classList.remove('cur'));const e=$('c'+k);if(e){e.classList.add('cur');if(!au.paused)e.scrollIntoView({block:'center',behavior:'smooth'})}};
document.addEventListener('keydown',e=>{if(e.target.tagName=='SELECT')return;const k=e.key.toLowerCase();
 if(k==' '){e.preventDefault();au.paused?au.play():au.pause()}
 else if(k=='a')mark('A');else if(k=='w')mark('W');else if(k=='p')mark('P');else if(k=='n'){const n=prompt('Note');mark('N',n||'')}
 else if(k=='r'){au.currentTime=Math.max(0,au.currentTime-3);au.play()}
 else if(k=='z'){marks.pop();save();render()}
 else if(k=='j'||k=='k'){const cs=D.segments[si].chunks;let i=chunkAt(au.currentTime)+(k=='k'?1:-1);i=Math.min(cs.length-1,Math.max(0,i));au.currentTime=cs[i].start;au.play()}
 else if(e.key=='ArrowLeft'){e.preventDefault();au.currentTime-=2}else if(e.key=='ArrowRight'){e.preventDefault();au.currentTime+=2}});
load(0);
</script></html>

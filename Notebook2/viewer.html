:root{--bg:#f6f3ec;--ink:#1d1b16;--line:#cfc8b8;--hl:#ffe08a;--gap:#f7b2a8;--acc:#27507a}

const DATA={"imgbase": "../../../Assets/Diary/Notebook2/prep/e1568/", "sets": ["pilot/fable-e1200"], "pages": [{"id": "01", "file": "1.jpg", "type": "", "text": {"pilot/fable-e1200": "Obóz na linji kolejowej Bou-Arfa Colomb-Bechar 98 km\ndn 1 II 1942 Niedziela\n\nOd rana dmie siroko[?] więc dlatego dzisiejszą zbiórkę\nzwołano za kuchnią która jest jedynym okazalszym\nbudynkiem obozu. Budynek ten dawał coś nie\ncoś schronienia przed wiatrem i pozwalał na od-\nczytanie rozkazów. Odczytano najpierw rozkazy\nstarego d-cy w którym ogłosono[?] kary dla kolegów\nSieroty i Ołoty po 15 dni a nawet nie dodano\nza co, jedynie tylko że to jest z polecenia d-cy.\nKoledze Tomaszewskiemu podniósł pułkownik d-ca\nokręgu Ain Sefra karę do 21 dni aresztu i sprawę\nskierowano do sądu wojskowego. Odczytano\nnastępnie przepisy porządkowe w namiotach\nnakaz salutowania d-cy grupy pod karą. Po odczy-\ntaniu rozkazów zabrał głos nowy d-ca też por.\na nie kpt jak to przedtem mówiono. Mówiąc\nw ten sposób.\nJestem niezmiernie dumny że wyznaczono\nmnie na d-cę grupy polskich żołnierzy którzy\nwalczyli za Francję. Wiem o tem że nie spodzie-\nwaliście się tu tak ciężko pracować przyjeżdża-\njąc tu jako żołnierze lecz bierzcie przykład z Legji\nCudzoziemskiej która po walce zamienia karabin\nna łopatę i kilof aby budować drogi i mosty\na <skreślone: [...]> w razie potrzeby znów chwyta za broń. Ja też\nmocno wierzę że wraz z wami chwycę za broń\ngdy zajdzie potrzeba. Ja pokładam w was cał-\nkowite moje zaufanie i proszę byście i mnie\nufali a dołożę wszelkich starań by wam\npoprawić pobyt w obozie, lecz do tego muszę\nmieć atut w ręku. a nim jest lepsza wydaj-\nność pracy. Wy powinniście być dumni że\ndokładacie swą pracę do tak wielkiego dzieła\njakim jest budowa kolei Mediterrane Niger.\nPo tem przemówieniu które tłomaczył na polski\nsierż.[?] Nowicki[?] (młody) nowy d-ca salutował kompanię\ni kompania rozeszła się.\n\n2 II 1942 Poniedziałek\nDziś przy pracy zarządzono by każdy wywiózł na\npryzmę[?] 15 taczek kamieni. Jeden z dozorców zapi-\nsywał każdą taczkę. W ten sposób osiągnięto\no 17 m³ kamienia więcej. I było by wszystko\nw porządku ale nasi ludzie nie umią\npracować bo jak się z rana wzięli\n"}, "meta": {"pilot/fable-e1200": {"page": "01", "type": "handwriting", "language": "pl", "dates": ["1942-02-01", "1942-02-02"], "margin_notes": "word 'nakaz' added in the left margin, placed in the text", "notes": "Page title line gives the camp location (98 km). 'siroko' is probably the sirocco wind.", "words": 329, "uncertain": 6, "model": "claude-fable-5-2 (configured id; read in chat session)", "images": "e1200", "prompt": "a_transcribe_prompt.md v1", "transcribed_on": "2026-11-11"}}}, {"id": "02", "file": "2.jpg", "type": "", "text": {}, "meta": {}}, {"id": "03", "file": "3.jpg", "type": "", "text": {}, "meta": {}}, {"id": "04", "file": "4.jpg", "type": "", "text": {}, "meta": {}}, {"id": "05", "file": "5.jpg", "type": "", "text": {}, "meta": {}}, {"id": "06", "file": "6.jpg", "type": "", "text": {}, "meta": {}}, {"id": "07", "file": "7.jpg", "type": "", "text": {}, "meta": {}}, {"id": "08", "file": "8.jpg", "type": "", "text": {}, "meta": {}}, {"id": "09", "file": "9.jpg", "type": "", "text": {}, "meta": {}}, {"id": "10", "file": "10.jpg", "type": "", "text": {}, "meta": {}}, {"id": "11", "file": "11.jpg", "type": "", "text": {}, "meta": {}}, {"id": "12", "file": "12.jpg", "type": "", "text": {}, "meta": {}}, {"id": "13", "file": "13.jpg", "type": "", "text": {}, "meta": {}}, {"id": "14", "file": "14.jpg", "type": "", "text": {}, "meta": {}}, {"id": "15", "file": "15.jpg", "type": "", "text": {}, "meta": {}}, {"id": "16", "file": "16.jpg", "type": "", "text": {}, "meta": {}}, {"id": "17", "file": "17.jpg", "type": "", "text": {"pilot/fable-e1200": "Prawie przez cały czas trwania siroka\nmusieliśmy przebywać na wietrze napra-\nwiając[?] namiot dopiero późno wieczór\ngdy wiatr ustał mogliśmy go znów\npostawić. Nigdy tego siroka nie zapomnę\nzupełnie było podobne do huraganu\nna filmie pod tyt. „Suez”.\n\n22 III 1942 Niedziela\nJeszcze raz dzisiejszej nocy zerwało się\nsiroko z przeciwnej strony lecz szczęśli-\nwie namiot wytrzymał. Rano przy-\nszedł adjutant i kazał nam rozebrać\nnamiot motywując tem że zaraz przy-\njedzie komisja obejżeć te namioty a jak\nokaże się złe to dostaniemy nowe.\nCzekaliśmy na tę komisję pół dnia\nna upale. Podczas tego oczekiwania wy-\nsłaliśmy jednego do d-cy obozu żeśmy się\nnie wyspali i jeść nam się chce. D-ca\ndał nam 2 bochenki chleba i 2 pudełka\nsardynek na 12 tu ludzi do tego dołoży-\nliśmy sobie po 3 jajka kupione w kantynie\ni Czerwony Krzyż dał nam po troszku\noliwy. Było z tego dobre drugie śniada-\nnie. Po odjeździe komisji która obie-\ncała nowe namioty znów namiot pos-\ntawiliśmy.\n\n23 III 1942 Poniedziałek\nPraca dziś idzie bardzo ociężale tak że ja[?]\nledwo na godz. 18 tą skończyliśmy.\n\n24 III 1942 Wtorek\nBardzo zimny północny wiatr tak nas\nnastraszył że 20 tu zapisało się do lekarza\nw związku z tem adjutant pospieszał[?] wstrzymał\npójście do pracy aż doktór zbadał chorych.\nWszystkich ich wypędził do pracy.\nPo południu 50 ludzi ładuje kamień na\nwagony. Bardzo to ciężka praca.\n\n25 III 1942 Środa\nPo południu nie pracujemy ponieważ lekarz\nkolejowy bada kompanię przed zastrzykami\n"}, "meta": {"pilot/fable-e1200": {"page": "17", "type": "handwriting", "language": "pl", "dates": ["1942-03-22", "1942-03-23", "1942-03-24", "1942-03-25"], "margin_notes": "small unclear mark in the left margin beside the 23 III header", "notes": "Top of page continues the previous entry (21 III?). 'Krzyż' is written over another word. Right edge slightly cropped on line 2.", "words": 244, "uncertain": 3, "model": "claude-fable-5-2 (configured id; read in chat session)", "images": "e1200", "prompt": "a_transcribe_prompt.md v1", "transcribed_on": "2026-11-11"}}}, {"id": "18", "file": "18.jpg", "type": "", "text": {}, "meta": {}}, {"id": "19", "file": "19.jpg", "type": "", "text": { se résistance des troupes allemandes.\nL'artillerie allemande a été mise en action aussitôt et a détruit plusieurs chars\nbritanniques. Les contre-mesures allemandes se développent conformément aux\nplans établis.\n\nCONTRE-ATTAQUES ALLEMANDES\nBerlin 19 août.\nLe D.N.B. apprend de source militaire :\n— Les contre-attaques allemandes contre les forces britanniques débarquées dans la\nrégion de Dieppe sont en cours depuis plusieurs heures. Les troupes allemandes pro-\ngressent conformément aux plans établis. Les Britanniques subissent des pertes consi-\ndérables en hommes et en matériel. »\n\nDieppe est situé à 55 kilomètres au Nord-Ouest de Rouen\nREPRODUCTION[?] INTERDITE Y. Y. 5448\n[/wycinek]\n[zdjęcie: w wycinku mapa kanału La Manche z Anglią, Francją, Belgią i Niemcami; podpisy miast po francusku]\n[margines] Wycinek z francuskiej gazety „Echo d'Oran”\n[margines] przynoszący wiadomość o dezbarkowaniu[?]\n[margines] anglików\n"}, "meta": {"pilot/fable-e1200": {"page": "40", "type": "clipping", "language": "fr+pl", "dates": ["1942-08-19"], "margin_notes": "Polish note written vertically along the left edge of the clipping: it is from the Oran newspaper 'Echo d'Oran' and reports the English landing.", "notes": "Loose or glued newspaper clipping, scanned on its own (no notebook page visible). Date is the clipping's dateline (Berlin, 19 août), i.e. the Dieppe raid, 1942. Map place names not transcribed. A further headline at the bottom edge is cut off.", "words": 209, "uncertain": 2, "model": "claude-fable-5-2 (configured id; read in chat session)", "images": "e1200", "prompt": "a_transcribe_prompt.md v1", "transcribed_on": "2026-11-11"}}}, {"id": "40a", "file": "40_.jpg", "type": "", "text": {}, "meta": {}}, {"id": "41", "file": "41.jpg", "type": "", "text": {}, "meta": {}}, {"id": "42", "file": "42.jpg", "type": "", "text": {}, "meta": {}}, {"id": "43", "file": "43.jpg", "type": "", "text": {}, "meta": {}}, {"id": "44", "file": "44.jpg", "type": "", "text": {}, "m ble-e1200": "Szkoci też dają wyrazy swej przyjaźni\ni gościnności. Dziś dla uprzyjemnienia\nnam wieczoru przysłali nam grupę\nartystyczną małych szkociąt w wieku\nod 4 do 14 lat. Były tam tańce śpiewy\nnarodowe szkockie i innych narodów\nGwiazda tego zespołu pięknie wykonała\nKozaka. a inne artystki wykonały\ntaniec holenderski w strojach narodo-\nwych holenderskich oraz taniec hiszpań-\nski ze śpiewem też w strojach narodowych\nDzieci które tworzyły ten zespół jak twier-\ndzi oficer oświatowy rekrutowały się\nz rodzin górniczych. Były one czerstwe\nrumiane i wielką sympatją i szcze-\nrością odnosiły się do nas. Oficer\noświatowy nawiązując do tych\ndzieci powiedział my musimy\nwalczyć by dać wolność narodowi\nby dać polskim dzieciom należyte odży-\nwienie by wprowadzić na ich dzie-\ncinne twarzyczki szczery dziecinny\nuśmiech i zaufanie do ludzi jak\nu dzieci szkockich. Na zakończenie\ndzieci szkockie zaczęły śpiewać po\npolsku Jeszcze Polska co cała sala\npodchwyciła a następnie myśmy[?]\nzaczęli hymn angielski.\n\n9 XII 1942 Środa\nPogoda w Szkocji jest paskudna. Dnie i noce\npanuje tu mgła urozmaicona padaniem\ndeszczu. Dzisiejszy wieczór uprzyjemnił\nnam czytaniem opowieści góralskich\ni reportaży Wiecha p. Szczepan Baczyński[?]\nartysta scen warszawskich\nMiejscowość w której mieszkamy nazywa\nsię Ahtertool[?].\n"}, "meta": {"pilot/fable-e1200": {"page": "75", "type": "handwriting", "language": "pl", "dates": ["1942-12-09"], "margin_notes": "", "notes": "Top of page continues the previous entry (8 XII?). Scotland. The village name is probably Auchtertool (Fife), written phonetically; last letters overwritten.", "words": 191, "uncertain": 3, "model": "claude-fable-5-2 (configured id; read in chat session)", "images": "e1200", "prompt": "a_transcribe_prompt.md v1", "transcribed_on": "2026-11-11"}}}, {"id": "76", "file": "76.jpg", "type": "", "text": {}, "meta": {}}, {"id": "77", "file": "77.jpg", "type": "", "text": {}, "meta": {}}, {"id": "78", "file": "78.jpg" const $=id=>document.getElementById(id);
let pi=0,si=0,zoom=1,editing=false;
const key=()=>'z2:'+DATA.pages[pi].id;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function hl(t){
  return esc(t).split('\n').map(line=>{
    line=line.replace(/^\s*\[(\/?wycinek|margines|zdjęcie:[^\]]*)\]/,m=>'<span class="tag">'+m+'</span>');
    return line.split(/(\s+)/).map(w=>{
      if(/\[\.{3,}\]/.test(w)) return '<mark class="g">'+w+'</mark>';
      if(/\[\?\]|\[[^\]\s|]+\|[^\]]*\?\]/.test(w)) return '<mark class="u">'+w+'</mark>';
      return w}).join('')}).join('\n')}
function cur(){const p=DATA.pages[pi];const s=DATA.sets[si];return (p.text[s]??null)}
function render(){
  const p=DATA.pages[pi],s=DATA.sets[si];
  $('img').src=DATA.imgbase+p.id+'.jpg';
  const saved=localStorage.getItem(key());
  const base=cur();
  const t=saved!==null?saved:(base??'');
  $('view').innerHTML=base===null&&saved===null?'<i>no transcript for this page in set "'+s+'"</i>':hl(t);
  $('edit').value=t;
  const m=(p.meta[s]||{});
  const words=t.split(/\s+/).filter(Boolean),unc=words.filter(w=>/\[\?\]|\[\.{3,}\]|\|[^\]]*\?\]/.test(w)).length;
  $('meta').innerHTML='page <b>'+p.id+'</b> &middot; file '+esc(p.file)+' &middot; '+(m.type||p.type||'')+' '+(m.language||'')+
    (m.dates&&m.dates.length?' &middot; '+m.dates.join(', '):'')+(m.model?' &middot; '+esc(m.model)+' / '+esc(m.images||''):'')+
    (m.margin_notes?'<br>margin: '+esc(m.margin_notes):'')+(m.notes?'<br>note: '+esc(m.notes):'')+
    (saved!==null?'<br><span class="edited">showing your unsaved edits (kept in this browser)</span>':'');
  $('stat').textContent=words.length+' words, '+unc+' marked uncertain ('+(words.length?(100*unc/words.length).toFixed(1):0)+'%)';
  $('page').value=pi;$('set').value=si}
function setMode(e){editing=e;$('edit').style.display=e?'block':'none';$('view').style.display=e?'none':'block';
  $('mode').textContent=e?'Preview':'Edit';$('mode').classList.toggle('on',e);if(!e)render()}
function go(d){pi=Math.max(0,Math.min(DATA.pages.length-1,pi+d));render();$('imgpane').scrollTo(0,0)}
function z(f){zoom=f;const im=$('img');im.style.width=(im.naturalWidth*zoom)+'px'}
function fit(){const im=$('img');if(im.naturalWidth)z(($('imgpane').clientWidth-4)/im.naturalWidth)}
DATA.pages.forEach((p,i)=>$('page').add(new Option(p.id+(p.type&&p.type!=='handwriting'?' ('+p.type+')':''),i)));
DATA.sets.forEach((s,i)=>$('set').add(new Option(s,i)));
$('page').onchange=e=>{pi=+e.target.value;render()};$('set').onchange=e=>{si=+e.target.value;render()};
$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);
$('zin').onclick=()=>z(zoom*1.2);$('zout').onclick=()=>z(zoom/1.2);$('zfit').onclick=fit;$('img').onload=fit;
$('mode').onclick=()=>setMode(!editing);
$('edit').oninput=()=>localStorage.setItem(key(),$('edit').value);
$('revert').onclick=()=>{if(confirm('Discard your unsaved edits for page '+DATA.pages[pi].id+'?')){localStorage.removeItem(key());render()}};
$('save').onclick=()=>{const t=$('edit').value;const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));a.download=DATA.pages[pi].id+'.txt';a.click();
  alert('Downloaded '+a.download+'. Move it into Notebook2\\proofread\\ (it is the corrected text of this page).')};
document.onkeydown=e=>{if(e.altKey&&e.key==='ArrowRight')go(1);if(e.altKey&&e.key==='ArrowLeft')go(-1)};
let drag=null;const ip=$('imgpane');
ip.onmousedown=e=>{drag={x:e.clientX,y:e.clientY,l:ip.scrollLeft,t:ip.scrollTop};e.preventDefault()};
window.onmouseup=()=>drag=null;window.onmousemove=e=>{if(drag){ip.scrollLeft=drag.l-(e.clientX-drag.x);ip.scrollTop=drag.t-(e.clientY-drag.y)}};
const h=location.hash.slice(1).split(',');if(h[0]){const i=DATA.pages.findIndex(p=>p.id===h[0]);if(i>=0)pi=i}
if(h[1]){const i=DATA.sets.indexOf(h[1]);if(i>=0)si=i}
render();
